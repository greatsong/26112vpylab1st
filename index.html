  <title>빛나는 컬러 피아노: 건반을 누르면 그 음의 색으로 빛나고, 버튼으로 악기를 바꾸거나 곡을 연주합니다. — VPyLab</title>
  <style>
    .vp-widget-panel {
  position: absolute;
  top: 8px;
  right: 108px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: min(280px, calc(100% - 124px));
  max-height: 60%;
  overflow: auto;
  padding: 10px 12px;
  border: 1px solid var(--widget-line, var(--color-border, #a6a6a6));
  border-radius: 12px;
  background: var(--widget-panel, var(--color-bg-panel, rgba(255,255,255,.94)));
  box-shadow: 0 3px 12px #0002;
  color: var(--widget-ink, var(--color-text-primary, #222));
  font: 500 13px/1.4 var(--font-body, system-ui, sans-serif);
  accent-color: var(--widget-accent, var(--color-accent, #5149a8));
}
.vp-widget-panel > div { min-width: 0; max-width: 100%; }
.vp-widget-panel :where(button, select, input:not([type=range],[type=checkbox],[type=radio])) {
  min-width: 0;
  max-width: 100%;
  min-height: 32px;
  padding: 4px 10px;
  border: 1px solid var(--widget-line, var(--color-border, #a6a6a6));
  border-radius: 9px;
  background-color: var(--widget-field, var(--color-bg-secondary, #f5f5f5));
  color: inherit;
  font: inherit;
}
.vp-widget-panel :is(button, select) { cursor: pointer; }
.vp-widget-panel button { font-weight: 600; overflow-wrap: anywhere; }
.vp-widget-panel button:active:enabled { border-color: var(--widget-accent, var(--color-accent, #5149a8)); }
.vp-widget-panel :disabled { opacity: .55; cursor: default; }
.vp-widget-panel :focus-visible { outline: 2px solid var(--widget-accent, var(--color-accent, #5149a8)); outline-offset: -2px; }
.vp-widget-panel .vp-slider-label, .vp-input-label { overflow-wrap: anywhere; max-width: 40%; }
.vp-widget-panel input[type=range] { min-width: 0; cursor: pointer; }
.vp-widget-panel [data-widget-value] {
  min-width: 3em;
  padding: 2px 5px;
  border-radius: 5px;
  background: var(--widget-field, var(--color-bg-secondary, #f5f5f5));
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.vp-widget-panel :is([data-widget-kind=winput],[data-vpylab-input]) input { flex: 1; }
/* 날짜와 시각 전체가 들어갈 폭을 먼저 확보하고, 좁으면 라벨 다음 줄에 놓습니다. */
.vp-widget-panel [data-widget-kind=winput]:has(> input[type=datetime-local]) { flex-wrap: wrap; }
.vp-widget-panel [data-widget-kind=winput] input[type=datetime-local] {
  flex: 1 1 15rem;
  min-inline-size: min(100%, 15rem);
  font-variant-numeric: tabular-nums;
}
.vp-view-toggle { display: none; }

@media (max-width: 640px), (max-height: 500px) and (pointer: coarse) {
  [data-single-canvas]:has(> .vp-widget-panel) {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    touch-action: auto !important;
  }
  [data-single-canvas] > .vp-stage-frame {
    min-width: 0;
    min-height: 0;
    touch-action: none;
  }
  /* 다중 캔버스에서도 본 장면 다음에 그 장면의 위젯을 둡니다. */
  [data-vpylab-viewport]:not([data-single-canvas]):has(> .vp-widget-panel) {
    display: flex;
    flex-direction: column;
    touch-action: pan-y !important;
  }
  [data-vpylab-viewport]:not([data-single-canvas]) > div { flex-shrink: 0; }
  [data-vpylab-viewport]:not([data-single-canvas]) > .vp-stage-frame { order: -2; }
  [data-vpylab-viewport]:not([data-single-canvas]) > .vp-widget-panel { order: -1; }

  [data-vpylab-viewport] > .vp-widget-panel {
    position: static;
    grid-row: 2;
    flex-flow: row wrap;
    align-content: flex-start;
    align-items: center;
    gap: 6px 8px;
    max-width: none;
    max-height: clamp(64px, 22dvh, 164px);
    padding: 7px max(12px, env(safe-area-inset-right)) max(7px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    border-width: 1px 0 0;
    border-radius: 0;
    box-shadow: none;
    overscroll-behavior: contain;
    touch-action: pan-y;
    scrollbar-width: thin;
  }
  .vp-widget-panel > :is([data-widget-kind=slider], [data-widget-kind=winput], [data-vpylab-input]) { flex: 1 1 100%; }
  .vp-widget-panel > [data-widget-kind=slider]:first-child:has(+ [data-widget-kind=button]:last-child) { flex-basis: 190px; }
  .vp-widget-panel:has(input[type=datetime-local]) > [data-widget-kind=slider] { flex-basis: 170px; }
  .vp-widget-panel > [data-widget-kind=menu] { flex: 1 1 124px; }
  .vp-widget-panel select { width: 100%; text-overflow: ellipsis; }
  .vp-widget-panel :is(button, select, input:not([type=radio],[type=checkbox])) { min-height: 44px; }
  .vp-widget-panel button { min-width: 44px; }
  .vp-widget-panel [data-widget-kind=checkbox] label, .vp-widget-panel [data-widget-kind=radio] label {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
  }
  .vp-view-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 48px;
    min-height: 38px;
    padding: 0 10px;
    background: var(--color-bg-secondary, #f5f5f5);
    color: var(--color-text-primary, #222);
    border: 1px solid var(--color-border, #a6a6a6);
    font-size: 13px;
  }

  .vp-view-tools[data-open="false"] { display: none; }
  .vp-view-tools :is(button, label) { min-height: 36px; }
}

    #console.visible { display: block; }

  // group(묶음) 안으로 객체를 옮긴다. 하위 객체의 위치는 묶음 기준 상대 좌표가 된다.
  function attachToGroup(mesh, groupId) {
    const parent = groupId ? meshes.get(groupId) : null;
    if (parent?.userData?.vpType === 'group') parent.add(mesh);
  }

  function processCmd(command) {
    const cmd = normalizeRenderColors(command);
    if (cmd.action === 'widget_create') return widgets.createWidget(cmd);
    if (cmd.action === 'widget_update') return widgets.updateWidget(cmd);
    if (cmd.action === 'widget_delete') return widgets.deleteWidget(cmd);
    if (cmd.action === 'pause_notice') return widgets.createPauseNotice(cmd);
    if (cmd.action === 'create') {
      let mesh;
      const baseColor = toColor(cmd.color || [1,1,1]);
      const mat = new THREE.MeshStandardMaterial({
        color: baseColor, roughness: cmd.shininess === undefined ? 0.4 : Math.max(0.05,1-cmd.shininess), metalness: 0.1,
        emissive: cmd.emissive ? cloneColor(baseColor) : new THREE.Color(0,0,0),
        emissiveIntensity: cmd.emissive ? 0.8 : 0,
        transparent: (cmd.opacity ?? 1) < 1, opacity: cmd.opacity ?? 1,
      });
      if (cmd.texture) setTexture(mat, cmd.texture);
      switch (cmd.type) {
        case 'sphere': mesh = new THREE.Mesh(new THREE.SphereGeometry(cmd.radius || 1, 32, 16), mat); break;
        case 'box': { const s = cmd.size || [cmd.length||1, cmd.height||1, cmd.width||1]; mesh = new THREE.Mesh(new THREE.BoxGeometry(s[0],s[1],s[2]), mat); break; }
        case 'cylinder': {
          const r = cmd.radius||1; const a = cmd.axis||[1,0,0]; const l = Math.hypot(...a)||1;
          mesh = new THREE.Mesh(primitiveGeometry.cylinder(r,l), mat);
          const dir = new THREE.Vector3(...a).normalize();
          mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
          break;
        }
        case 'arrow': {
          const a = cmd.axis||[1,0,0]; const l = Math.hypot(...a)||1; const sw = cmd.shaftwidth||0.1;
          const group = new THREE.Group();
          const shaft = new THREE.Mesh(new THREE.CylinderGeometry(sw/2,sw/2,l*0.8,8), mat);
          shaft.position.y = l*0.4; group.add(shaft);
          const head = new THREE.Mesh(new THREE.ConeGeometry(sw*1.5,l*0.2,8), mat);
          head.position.y = l*0.9; group.add(head);
          const dir = new THREE.Vector3(...a).normalize();
          group.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
          mesh = group; break;
        }
        case 'cone': {
          const r = cmd.radius||1; const a = cmd.axis||[1,0,0]; const l = Math.hypot(...a)||1;
          mesh = new THREE.Mesh(primitiveGeometry.cone(r,l), mat);
          const dir = new THREE.Vector3(...a).normalize();
          mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
          break;
        }
        case 'ring': mesh = new THREE.Mesh(new THREE.TorusGeometry(cmd.radius||1, cmd.thickness||0.1, 16, 48), mat); mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), new THREE.Vector3(...(cmd.axis||[1,0,0])).normalize()); break;
        case 'pyramid': {
          mesh = new THREE.Mesh(primitiveGeometry.pyramid(cmd.size || [1,1,1]), mat);
          break;
        }
        case 'ellipsoid': {
          const sz = cmd.size || [1,1,1];
          mesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 16), mat);
          mesh.scale.set(sz[0], sz[1], sz[2]);
          break;
        }
        case 'helix': {
          const r = cmd.radius||1; const a = cmd.axis||[1,0,0]; const len = cmd.length ?? 1;
          const coils = cmd.coils||5; const seg = Math.max(64, coils*32);
          const positions = [];
          for (let i=0;i<=seg;i++){const t=i/seg;const ang=t*coils*Math.PI*2;positions.push(t*len, r*Math.cos(ang), r*Math.sin(ang));}
          const g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
          mesh = new THREE.Line(g, new THREE.LineBasicMaterial({color: baseColor, transparent:(cmd.opacity??1)<1, opacity:cmd.opacity??1}));
          mesh.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), new THREE.Vector3(...a).normalize());
          break;
        }
        case 'label': {
          // 캔버스 텍스처 → Sprite (항상 카메라를 향함)
          const text = String(cmd.text||''); const fontPx = cmd.height||16;
          const measure = document.createElement('canvas').getContext('2d');
          measure.font = (fontPx*2) + 'px sans-serif';
          const tw = Math.max(32, Math.ceil(measure.measureText(text||' ').width)+12);
          const th = Math.max(32, Math.ceil(fontPx*2*1.4)+12);
          const cv = document.createElement('canvas'); cv.width=tw; cv.height=th;
          const ctx = cv.getContext('2d');
          if (cmd.background) { const c=cmd.background; ctx.fillStyle = 'rgba('+Math.round(c[0]*255)+','+Math.round(c[1]*255)+','+Math.round(c[2]*255)+',0.85)'; ctx.fillRect(0,0,tw,th); }
          const c = cmd.color||[1,1,1];
          ctx.fillStyle = 'rgb('+Math.round(c[0]*255)+','+Math.round(c[1]*255)+','+Math.round(c[2]*255)+')';
          ctx.font = (fontPx*2) + 'px sans-serif';
          ctx.textBaseline='middle'; ctx.textAlign='center';
          ctx.fillText(text, tw/2, th/2);
          const tex = new THREE.CanvasTexture(cv);
          const sm = new THREE.SpriteMaterial({map:tex, transparent:true, opacity:cmd.opacity??1, depthTest:false, depthWrite:false});
          mesh = new THREE.Sprite(sm);
          const ws = fontPx/32;
          mesh.scale.set((tw/th)*ws, ws, 1);
          break;
        }
        case 'curve':
        case 'points': {
          // 점마다 색을 가진 폴리라인/점 집합 — 재질 색은 흰색으로 두고 정점 색으로 그린다
          mat.dispose();
          const pointList = cmd.points || [];
          const baseColor = cmd.color || [1, 1, 1];
          const initialPoints = pointList.flat();
          const initialColors = (Array.isArray(cmd.colors) && cmd.colors.length === pointList.length)
            ? cmd.colors.flat()
            : pointList.flatMap(() => baseColor);
          const geom = new THREE.BufferGeometry();
          geom.setAttribute('position', new THREE.Float32BufferAttribute(initialPoints, 3));
          geom.setAttribute('color', new THREE.Float32BufferAttribute(initialColors, 3));
          if (cmd.type === 'curve') {
            const cmat = new THREE.LineBasicMaterial({
              vertexColors: true,
              transparent: cmd.opacity < 1,
              opacity: cmd.opacity ?? 1,
            });
            mesh = new THREE.Line(geom, cmat);
          } else {
            // size_units='world'면 점마다의 radius(평균)로 크기를 정하고, 기본은 픽셀 크기(size)
            const radii = Array.isArray(cmd.radii) ? cmd.radii.filter((r) => r > 0) : [];
            const avgRadius = radii.length ? radii.reduce((a, b) => a + b, 0) / radii.length : (cmd.radius || 0);
            const worldUnits = cmd.size_units === 'world';
            const pmat = new THREE.PointsMaterial({
              vertexColors: true,
              size: worldUnits ? Math.max(2 * (avgRadius || 0.02), 1e-3) : (cmd.size ?? 5) * 0.02,
              sizeAttenuation: true,
              transparent: cmd.opacity < 1,
              opacity: cmd.opacity ?? 1,
            });
            configureParticles(THREE, pmat, cmd);
            mesh = new THREE.Points(geom, pmat);
            if (cmd.shape === 'plume') mesh.frustumCulled = false;
          }
          mesh.userData = {
            vpType: cmd.type,
            boxAxis: cmd.axis || [1,0,0],
            boxUp: cmd.up || [0,1,0],
          };
          applyBoxOrientation(mesh);
          if (Array.isArray(cmd.origin)) mesh.position.set(cmd.origin[0], cmd.origin[1], cmd.origin[2]);
          curves.set(cmd.id, {
            line: mesh,
            positions: initialPoints.slice(),
            colors: initialColors.slice(),
            kind: cmd.type,
            baseColor,
          });
          break;
        }
        case 'triangle':
        case 'quad': {
          const verts = cmd.vertices || [];
          const positions = []; const colors = [];
          const indices = cmd.type === 'triangle' ? [0,1,2] : [0,1,2,0,2,3];
          for (const i of indices) {
            const v = verts[i] || {pos:[0,0,0], color:[1,1,1]};
            positions.push(v.pos[0], v.pos[1], v.pos[2]);
            colors.push(v.color[0], v.color[1], v.color[2]);
          }
          const g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
          g.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
          g.computeVertexNormals();
          mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors:true, side:THREE.DoubleSide, roughness:0.5, metalness:0.05}));
          break;
        }
        case 'extrusion': {
          const path = cmd.path || []; const shape = cmd.shape || [];
          if (path.length >= 2 && shape.length >= 3) {
            const sh = new THREE.Shape();
            sh.moveTo(shape[0][0], shape[0][1]);
            for (let i=1;i<shape.length;i++) sh.lineTo(shape[i][0], shape[i][1]);
            sh.closePath();
            const cv = new THREE.CatmullRomCurve3(path.map(p => new THREE.Vector3(p[0], p[1], p[2]??0)));
            mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, {steps: Math.max(path.length*4,12), extrudePath: cv}), mat);
          } else {
            mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), mat);
          }
          break;
        }
        case 'group': {
          // 묶음: 하위 객체는 create 명령의 group 값으로 이 묶음 안에 들어온다(위치는 묶음 기준)
          mat.dispose();
          mesh = new THREE.Group();
          break;
        }
        case 'local_light': {
          const vpLight = cmd.distance_falloff === false;
          const lt = new THREE.PointLight(toColor(cmd.color||[1,1,1]), (cmd.intensity??1)*(vpLight ? Math.PI/0.9 : 1), vpLight ? 0 : 50, vpLight ? 0 : 2);
          if(cmd.pos) lt.position.set(...cmd.pos); scene.add(lt); meshes.set(cmd.id, lt); return;
        }
        case 'distant_light': {
          const lt = new THREE.DirectionalLight(toColor(cmd.color||[1,1,1]), cmd.intensity??1);
          const d=cmd.direction||[0,-1,0]; lt.position.set(-d[0]*10,-d[1]*10,-d[2]*10);
          scene.add(lt); meshes.set(cmd.id, lt); return;
        }
        default: return;
      }
      if (cmd.pos) mesh.position.set(cmd.pos[0], cmd.pos[1], cmd.pos[2]);
      mesh.visible = cmd.visible !== false;
      mesh.userData = Object.assign(mesh.userData || {}, { vpType: cmd.type, vpId: cmd.id });
      if (cmd.type === 'arrow') { const a0 = cmd.axis || [1,0,0]; mesh.userData.arrowLen = Math.hypot(...a0) || 1; mesh.userData.shaftwidth = cmd.shaftwidth || 0.1; }
      if (cmd.type === 'helix') { mesh.userData.helixRadius = cmd.radius || 1; mesh.userData.helixCoils = cmd.coils || 5; }
      if (['box','pyramid','ellipsoid'].includes(cmd.type) && (cmd.axis || cmd.up)) { mesh.userData.boxAxis = cmd.axis || [1,0,0]; mesh.userData.boxUp = cmd.up || [0,1,0]; applyBoxOrientation(mesh); }
      scene.add(mesh);
      meshes.set(cmd.id, mesh);
      attachToGroup(mesh, cmd.group);
      if (cmd.make_trail) createTrail(cmd);
    } else if (cmd.action === 'update') {
      const m = meshes.get(cmd.id); if (!m) return;
      if (cmd.flow_time !== undefined && m.material?.userData.flowTime) m.material.userData.flowTime.value = cmd.flow_time;
      if ('texture' in cmd && m.material?.isMeshStandardMaterial) setTexture(m.material, cmd.texture);
      if (cmd.pos) m.position.set(cmd.pos[0], cmd.pos[1], cmd.pos[2]);
      if (cmd.color) {
        if (m.isLight) m.color = toColor(cmd.color);
        else if (m.userData?.vpType === 'compound') compoundAppearance.apply(m, {color:cmd.color});
        else if (m.isGroup) m.traverse(c => { if(c.material) updateMaterialColor(c.material, toColor(cmd.color)); });
        else if (m.material) updateMaterialColor(m.material, toColor(cmd.color));
      }
      if (cmd.intensity !== undefined && m.isLight) m.intensity = cmd.intensity * (m.isPointLight && m.decay === 0 ? Math.PI/0.9 : 1);
      if (cmd.direction !== undefined && m.isDirectionalLight) m.position.set(-cmd.direction[0]*10,-cmd.direction[1]*10,-cmd.direction[2]*10);
      if (cmd.visible !== undefined) m.visible = cmd.visible;
      if (cmd.opacity !== undefined) {
        if(m.userData?.vpType==='compound') compoundAppearance.apply(m,{opacity:cmd.opacity});
        else if (m.isGroup) m.traverse(c => { if(c.material)compoundAppearance.setOpacity(c.material,cmd.opacity); });
        else if (m.material) compoundAppearance.setOpacity(m.material,cmd.opacity);
      }
      if(cmd.shininess!==undefined && m.userData?.vpType==='compound')compoundAppearance.apply(m,{shininess:cmd.shininess});
      if (cmd.emissive !== undefined && !m.isLight) {
        if(m.userData?.vpType==='compound') compoundAppearance.apply(m,{emissive:cmd.emissive});
        else if (m.isGroup) m.traverse(c => { if(c.material) setMaterialEmissive(c.material, cmd.emissive); });
        else if (m.material) setMaterialEmissive(m.material, cmd.emissive);
      }
      if (cmd.radius !== undefined && m.geometry) {
        let ng;
        if(m.geometry.type==='SphereGeometry') ng=new THREE.SphereGeometry(cmd.radius,32,16);
        else if(m.geometry.type==='ConeGeometry'&&m.userData?.vpType!=='pyramid') ng=primitiveGeometry.cone(cmd.radius,m.geometry.parameters?.height||1);
        else if(m.geometry.type==='CylinderGeometry') ng=primitiveGeometry.cylinder(cmd.radius,m.geometry.parameters?.height||1);
        else if(m.geometry.type==='TorusGeometry') ng=new THREE.TorusGeometry(cmd.radius,m.geometry.parameters?.tube||0.1,16,48);
        if(ng){m.geometry.dispose();m.geometry=ng;}
      }
      if (m.isPoints && cmd.size !== undefined) m.material.size = cmd.size * 0.02;
      if (cmd.origin) m.position.fromArray(cmd.origin);
      if (!m.isPoints && cmd.size !== undefined && m.geometry) {
        const s=cmd.size;
        if(m.userData?.vpType==='pyramid'){m.geometry.dispose();m.geometry=primitiveGeometry.pyramid(s);}
        else if (m.geometry.type==='SphereGeometry') { m.scale.set(s[0],s[1],s[2]); } // ellipsoid: sphere+scale — 상자로 바꾸지 않음
        else { const ng=new THREE.BoxGeometry(s[0],s[1],s[2]); m.geometry.dispose(); m.geometry=ng; }
      }
      if (cmd.thickness !== undefined && m.geometry?.type==='TorusGeometry') { const r=m.geometry.parameters?.radius||1; const ng=new THREE.TorusGeometry(r,cmd.thickness,16,48); m.geometry.dispose(); m.geometry=ng; }
      if (cmd.axis !== undefined || cmd.up !== undefined) {
        const vpType = m.userData?.vpType;
        if (['box','pyramid','ellipsoid','compound','curve','points'].includes(vpType)) {
          if (cmd.axis) m.userData.boxAxis = cmd.axis;
          if (cmd.up) m.userData.boxUp = cmd.up;
          applyBoxOrientation(m);
        } else if (cmd.axis !== undefined) {
          const len = Math.hypot(...cmd.axis) || 1;
          const dir = new THREE.Vector3(...cmd.axis).normalize();
          if (vpType === 'cylinder' && m.geometry) { const r=m.geometry.parameters?.radiusTop??1; m.geometry.dispose(); m.geometry=primitiveGeometry.cylinder(r,len); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir); }
          else if (vpType === 'cone' && m.geometry) { const r=m.geometry.parameters?.radius??1; m.geometry.dispose(); m.geometry=primitiveGeometry.cone(r,len); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir); }
          else if (vpType === 'ring') { m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir); }
          else if (vpType === 'arrow') { m.userData.arrowLen=len; rebuildArrow(m, len, m.userData.shaftwidth||0.1); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir); }
          else if (vpType === 'helix') { rebuildHelixLen(m, len); m.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),dir); }
          else { m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir); }
        }
      }
    } else if (cmd.action === 'scene') {
      if (cmd.property === 'title' || cmd.property === 'caption') {
        document.getElementById('scene-' + cmd.property).textContent = String(cmd.value);
      }
      if (cmd.property === 'ambient') {
        ambientLight.color = toColor(cmd.value);
        ambientLight.intensity = 1;
      }
      if (cmd.property === 'lights') {
        dirLight.visible = false;
        const enabled = new Set(cmd.value);
        for (const [id, mesh] of meshes) if (mesh.isLight) mesh.visible = enabled.has(id);
      }
      if (cmd.property === 'background') scene.background = toColor(cmd.value);
      if (cmd.property === 'range') cameraSystem.setExplicitRange(cmd.value);
      if (cmd.property === 'center') cameraSystem.setExplicitCenter(...cmd.value);
      if (cmd.property === 'forward') cameraSystem.setForward(...cmd.value);
      if (cmd.property === 'up') cameraSystem.setUp(...cmd.value);
      if (cmd.property === 'fov') cameraSystem.setFov(cmd.value);
      if (cmd.property === 'userzoom') controls.enableZoom = Boolean(cmd.value);
      if (cmd.property === 'userspin') controls.enableRotate = Boolean(cmd.value);
      if (cmd.property === 'userpan') controls.enablePan = Boolean(cmd.value);
      if (cmd.property === 'autoscale') cameraSystem.setAutoscale(cmd.value);
      if (cmd.property === 'camera_pos') cameraSystem.setCameraPos(...cmd.value);
      if (cmd.property === 'camera_axis') cameraSystem.setCameraAxis(...cmd.value);
      if (cmd.property === 'camera_follow') cameraSystem.followObject(cmd.value ? meshes.get(cmd.value) : null);
    } else if (cmd.action === 'trail_update') {
      updateTrail(cmd);
    } else if (cmd.action === 'trail_clear') {
      const t = trails.get(cmd.id);
      if (t) { t.positions.length = 0; t.line.geometry.setAttribute('position', new THREE.Float32BufferAttribute([], 3)); t.line.geometry.computeBoundingSphere(); }
    } else if (cmd.action === 'trail_attach') {
      if (!trails.has(cmd.id) && meshes.has(cmd.id)) createTrail({id:cmd.id, pos: cmd.pos||[0,0,0], color:[1,1,1], trail_color: cmd.trail_color});
    } else if (['curve_append', 'curve_set', 'curve_clear'].includes(cmd.action)) {
      const curve = curves.get(cmd.id);
      if (!curve) return;
      if (cmd.action !== 'curve_append') {
        curve.positions.length = 0;
        curve.colors.length = 0;
      }
      for (const pos of cmd.points || []) curve.positions.push(...pos);
      for (const color of cmd.colors || []) curve.colors.push(...color);
      refreshCurveGeometry(curve);
    } else if (cmd.action === 'compound') {
      const group = new THREE.Group();
      for (const subId of (cmd.sub_ids||[])) {
        const subMesh = meshes.get(subId);
        if (subMesh) { subMesh.updateWorldMatrix(true,true);const world=subMesh.matrixWorld.clone();subMesh.removeFromParent();world.decompose(subMesh.position,subMesh.quaternion,subMesh.scale);group.add(subMesh); }
      }
      const center=cmd.center?new THREE.Vector3(...cmd.center):new THREE.Box3().setFromObject(group).getCenter(new THREE.Vector3());
      group.children.forEach(child=>child.position.sub(center));
      group.position.copy(cmd.pos?new THREE.Vector3(...cmd.pos):center);
      group.userData={vpType:'compound',vpId:cmd.id,boxAxis:cmd.axis||[1,0,0],boxUp:cmd.up||[0,1,0]};
      applyBoxOrientation(group);
      compoundAppearance.init(group);
      compoundAppearance.apply(group,cmd);
      group.visible = cmd.visible !== false;
      scene.add(group);
      meshes.set(cmd.id, group);
      attachToGroup(group, cmd.group);
      if (cmd.make_trail) createTrail(cmd);
    } else if (cmd.action === 'sound') {
      processSoundCmd(cmd);
    } else if (cmd.action === 'chart') {
      renderChart(cmd);
    }
  }

  // === Pyodide 직접 로드 + 실행 ===
  const progress = document.getElementById('progress');
  const loading = document.getElementById('loading');

  async function run() {
    progress.style.width = '20%';
    const pyodideCdns = [
      'https://cdn.jsdelivr.net/pyodide/v0.27.0/full/',
      'https://unpkg.com/pyodide@0.27.0/',
    ];
    let pyodideIndexUrl = null;
    let lastLoadError = null;
    for (const cdn of pyodideCdns) {
      const pyodideScript = document.createElement('script');
      pyodideScript.src = cdn + 'pyodide.js';
      document.head.appendChild(pyodideScript);
      try {
        await new Promise((resolve, reject) => {
          pyodideScript.onload = resolve;
          pyodideScript.onerror = () => reject(new Error(cdn + 'pyodide.js 로드 실패'));
        });
        pyodideIndexUrl = cdn;
        break;
      } catch (err) {
        lastLoadError = err;
        pyodideScript.remove();
      }
    }
    if (!pyodideIndexUrl) throw lastLoadError || new Error('Pyodide CDN 로드 실패');
    progress.style.width = '50%';

    const pyodide = await loadPyodide({ indexURL: pyodideIndexUrl });
    progress.style.width = '80%';

    // 코드가 import한 패키지를 편집기와 같은 규칙으로 설치합니다.

      ndc.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;

        while (owner && !owner.userData?.vpId) owner = owner.parent;
        if (owner) targets.push(object);
      });
      const hits = raycaster.intersectObjects(targets, false);

import json
import asyncio

import math

from math import *

_command_buffer = []

def _send_commands():
    global _command_buffer
    if _command_buffer:
        _js_process_batch(json.dumps({"type": "batch", "commands": _command_buffer}))
        _command_buffer = []

def _add_command(cmd):
    _command_buffer.append(cmd)

def _new_id():

    _object_counter += 1
    return f"obj_{_object_counter}"

# 클릭한 도형을 찾는 표: 화면 쪽 id → Python 객체. compound 부품의 id는 완성품을 가리킨다.
_pick_targets = weakref.WeakValueDictionary()

def _picked_object(pick_id):
    obj = _pick_targets.get(pick_id) if pick_id else None
    while obj is not None:
        owner = _pick_targets.get(obj._id)
        if owner is None or owner is obj:
            return obj if getattr(obj, 'visible', True) else None
        obj = owner
    return None

def _group_ref(value):
    """group= 인자를 검사해 group 객체를 돌려준다. None이면 None."""
    if value is None:
        return None
    if not isinstance(value, group):
        raise TypeError("group= 인자에는 group()으로 만든 객체를 넘겨야 합니다")
    return value


# === vector 클래스 ===
class vector:
    def __init__(self, x=0, y=0, z=0):
        self._change_callback = None
        if isinstance(x, vector): x, y, z = x.x, x.y, x.z
        elif isinstance(x, (list, tuple)) and len(x)==3: x, y, z = x
        self._x = float(x); self._y = float(y); self._z = float(z)
    @property
    def x(self): return self._x
    @x.setter
    def x(self,v):
        self._x=float(v)
        if self._change_callback: self._change_callback()
    @property
    def y(self): return self._y
    @y.setter
    def y(self,v):
        self._y=float(v)
        if self._change_callback: self._change_callback()
    @property
    def z(self): return self._z
    @z.setter
    def z(self,v):
        self._z=float(v)
        if self._change_callback: self._change_callback()
    def __repr__(self): return f"<{self.x:.4g}, {self.y:.4g}, {self.z:.4g}>"
    def __add__(self, o): return vector(self.x+o.x, self.y+o.y, self.z+o.z)
    def __sub__(self, o): return vector(self.x-o.x, self.y-o.y, self.z-o.z)
    def __mul__(self, s):
        if isinstance(s,(int,float)): return vector(self.x*s, self.y*s, self.z*s)
        return NotImplemented
    def __rmul__(self, s): return self.__mul__(s)
    def __truediv__(self, s): return vector(self.x/s, self.y/s, self.z/s)
    def __neg__(self): return vector(-self.x, -self.y, -self.z)
    def __eq__(self, o):
        if not isinstance(o, vector): return NotImplemented
        return self.x==o.x and self.y==o.y and self.z==o.z
    def __ne__(self, o):
        e = self.__eq__(o)
        return NotImplemented if e is NotImplemented else not e
    def __hash__(self): return hash((self.x, self.y, self.z))
    @property
    def mag(self): return (self.x**2 + self.y**2 + self.z**2)**0.5
    @property
    def mag2(self): return self.x**2 + self.y**2 + self.z**2
    @property
    def hat(self):
        m = self.mag
        return self/m if m else vector(0,0,0)
    def dot(self, o): return self.x*o.x + self.y*o.y + self.z*o.z
    def norm(self): return self.hat
    def cross(self, o): return vector(self.y*o.z-self.z*o.y, self.z*o.x-self.x*o.z, self.x*o.y-self.y*o.x)
    def to_list(self): return [self.x, self.y, self.z]
    def clone(self): return vector(self.x, self.y, self.z)
    def proj(self, b): bh = b.hat; return bh * self.dot(bh)
    def comp(self, b): return self.dot(b.hat)
    def diff_angle(self, b):
        import math
        m1=self.mag; m2=b.mag
        if m1==0 or m2==0: return 0.0
        c = self.dot(b)/(m1*m2)
        if c>1.0: c=1.0
        elif c<-1.0: c=-1.0
        return math.acos(c)
    def rotate(self, angle, axis=None):
        import math
        if axis is None: axis = vector(0,0,1)
        k = axis.hat
        ca = math.cos(angle); sa = math.sin(angle)
        v = self
        return v*ca + k.cross(v)*sa + k*(k.dot(v)*(1-ca))

def _bind_vector(owner, attr, value, notify=True):
    slot = '_' + attr
    previous = getattr(owner, slot, None)
    if value is not previous:
        if previous is not None:
            previous._change_callback = None
        value = value.clone()
        setattr(owner, slot, value)
    def changed():
        components = value.to_list()
        _add_command({'action':'update','id':owner._id,attr:components})
        if attr == 'pos' and getattr(owner, '_make_trail', False):
            _add_command({'action':'trail_update','id':owner._id,'pos':components})
    value._change_callback = changed
    if notify: changed()

    def _clone_kwargs(self):
        return {
            'pos': self._pos.clone() if isinstance(self._pos, vector) else self._pos,
            'color': self._color.clone() if isinstance(self._color, vector) else self._color,
            'visible': self._visible, 'opacity': self._opacity, 'emissive': self._emissive,
        }
    def clone(self, **kwargs):
        args = self._clone_kwargs(); args.update(kwargs)
        return self.__class__(**args)
    def rotate(self, angle, axis=None, origin=None):
        if axis is None: axis = vector(0,1,0)
        if origin is None: origin = self._pos
        rel = self._pos - origin
        new_rel = rel.rotate(angle, axis=axis)
        self.pos = origin + new_rel
        if hasattr(self, '_axis') and isinstance(self._axis, vector):
            self.axis = self._axis.rotate(angle, axis=axis)

        _add_command({"action":"trail_clear","id":self._id})
    def attach_trail(self, color=None, retain=10000):
        self._make_trail = True
        if color is not None: self._trail_color = color
        _add_command({"action":"trail_attach","id":self._id,

class compound:
    def __init__(self, objects, **kw):
        self._id = _new_id()
        self._objects = list(objects)
        self._group = _group_ref(kw.pop('group', None))
        _send_commands()
        bounds = json.loads(str(_js_compound_bounds(json.dumps([o._id for o in self._objects]))))
        self._center0 = _coerce_vector(kw.get('origin'), vector(*bounds['center']))
        self._size0 = vector(*bounds['size'])
        _bind_vector(self, 'pos', kw.get('pos', self._center0), False)
        axis = kw.get('axis', vector(1,0,0))
        self._axis = (axis.hat if axis.mag else vector(1,0,0)) * self._size0.x
        self._up = kw.get('up', vector(0,1,0))
        _bind_vector(self, 'color', kw.get('color') or color.white, False)
        self._visible = kw.get('visible', True)
        self._opacity = self._check_unit(kw.get('opacity',1.0),'opacity')
        self._shininess = self._check_unit(kw.get('shininess',0.6),'shininess')
        self._emissive = bool(kw.get('emissive',False))
        self._make_trail = kw.pop('make_trail', False)
        self._trail_color = kw.pop('trail_color', None)
        cmd = {
            "action":"compound","id":self._id,
            "sub_ids":[obj._id for obj in self._objects],
            "center":self._center0.to_list(), "axis":self._axis.to_list(), "up":self._up.to_list(),
            "pos":self._pos.to_list(),
            "color":self._color.to_list() if self._color else None,
            "visible":self._visible,"opacity":self._opacity,
            "make_trail":self._make_trail,
            "trail_color":self._trail_color.to_list() if self._trail_color else None,
        }
        if 'shininess' in kw: cmd['shininess']=self._shininess
        if 'emissive' in kw: cmd['emissive']=bool(kw['emissive'])
        if self._group is not None:
            self._group._objects.append(self)
            cmd['group'] = self._group._id
        _pick_targets[self._id] = self
        for part in self._objects:
            _pick_targets[part._id] = self
        _add_command(cmd)
    @property
    def axis(self): return self._axis
    @axis.setter

        self._up=v.clone()
        _add_command({'action':'update','id':self._id,'up':self._up.to_list()})
    def rotate(self,angle,axis=None,origin=None):
        axis=axis if axis is not None else self._axis
        origin=origin if origin is not None else self._pos
        self.pos=origin+(self._pos-origin).rotate(angle,axis=axis)
        self.axis=self._axis.rotate(angle,axis=axis)
        self.up=self._up.rotate(angle,axis=axis)

        _add_command({'action':'update','id':self._id,'shininess':self._shininess})

    @property
    def emissive(self): return self._emissive
    @emissive.setter
    def emissive(self,v):
        self._emissive=bool(v)
        _add_command({'action':'update','id':self._id,'emissive':self._emissive})

# === 새 프리미티브 (v3) ===
def _ellipsoid_vector(v):
    return v.clone() if isinstance(v, vector) else vector(*v)

class ellipsoid(box):
    _geometry_type = 'ellipsoid'
    def __init__(self, **kw):
        axis = _ellipsoid_vector(kw.pop('axis', vector(1,0,0)))
        size = kw.pop('size', None)
        if size is None:
            size = vector(kw.pop('length', axis.mag or 1), kw.pop('height',1), kw.pop('width',1))
        else:
            size = _ellipsoid_vector(size)
            for i, name in enumerate(('length','height','width')):
                if name in kw:
                    setattr(size, ('x','y','z')[i], float(kw.pop(name)))
        direction = axis.hat if axis.mag else vector(1,0,0)
        kw['axis'] = direction * size.x
        kw['up'] = _ellipsoid_vector(kw.pop('up', vector(0,1,0)))
        super().__init__(size=size, **kw)
        self._watch_vectors()
    def _watch_vectors(self):
        self._size._change_callback = lambda: setattr(self, 'size', self._size)
        self._axis._change_callback = lambda: setattr(self, 'axis', self._axis)
        self._up._change_callback = lambda: setattr(self, 'up', self._up)
    @property
    def size(self): return self._size
    @size.setter
    def size(self, value):
        self._size = _ellipsoid_vector(value)
        direction = self._axis.hat if self._axis.mag else vector(1,0,0)
        self._axis = direction * self._size.x
        self._watch_vectors()
        _add_command({'action':'update','id':self._id,'size':self._size.to_list(),'axis':self._axis.to_list()})
    @property
    def axis(self): return self._axis
    @axis.setter
    def axis(self, value):
        self._axis = _ellipsoid_vector(value)
        if self._axis.mag: self._size._x = self._axis.mag
        self._watch_vectors()
        _add_command({'action':'update','id':self._id,'axis':self._axis.to_list(),'size':self._size.to_list()})
    @property
    def up(self): return self._up
    @up.setter
    def up(self, value):
        self._up = _ellipsoid_vector(value)
        self._watch_vectors()
        _add_command({'action':'update','id':self._id,'up':self._up.to_list()})
    @property
    def length(self): return self._size.x
    @length.setter
    def length(self, value): self.size = vector(value,self._size.y,self._size.z)
    @property
    def height(self): return self._size.y
    @height.setter
    def height(self, value): self.size = vector(self._size.x,value,self._size.z)
    @property
    def width(self): return self._size.z
    @width.setter
    def width(self, value): self.size = vector(self._size.x,self._size.y,value)
    def _clone_kwargs(self):
        return {**super()._clone_kwargs(), 'size':self._size.clone(), 'axis':self._axis.clone(), 'up':self._up.clone()}

class pyramid(ellipsoid):
    _geometry_type = 'pyramid'

class helix(_GObject):

        super().__init__('helix', radius=self._radius, axis=self._axis.to_list(),
                         length=float(length), coils=int(self._coils), thickness=float(self._thickness), **kw)

# === group (객체 묶음, 하위 객체를 나중에 따로 바꿀 수 있다) ===
# 편집기 vpython-api.py의 group과 같은 뜻이다(명세: GlowScript lib/glow/primitives.js의 group, MIT).
# - 하위 객체의 pos는 묶음 기준 상대 위치이고 화면 위치는 g.pos를 더한 값이다
# - g.rotate()와 g.axis 변경은 하위 객체를 하나씩 돌린다. g.up·g.color는 하위 객체 모두에 전한다
class group:
    def __init__(self, **kw):
        self._id = _new_id()
        self._objects = []
        self._parent = _group_ref(kw.get('group'))
        _bind_vector(self, 'pos', _coerce_vector(kw.get('pos'), vector(0,0,0)), False)
        self._axis = _coerce_vector(kw.get('axis'), vector(1,0,0))
        self._up = _coerce_vector(kw.get('up'), vector(0,1,0))
        self._color = _coerce_vector(kw.get('color'), vector(1,1,1))
        self._visible = bool(kw.get('visible', True))
        cmd = {"action":"create","id":self._id,"type":"group","pos":self._pos.to_list(),"visible":self._visible}
        if self._parent is not None:
            self._parent._objects.append(self)
            cmd['group'] = self._parent._id
        _add_command(cmd)
    @property
    def objects(self):
        """묶음에 든 객체 목록(복사본). 객체는 box(group=g)처럼 만들 때 넣는다."""
        return list(self._objects)
    def __len__(self):
        return len(self._objects)
    def __getitem__(self, index):
        return self._objects[index]
    def group_to_world(self, v):
        return _coerce_vector(v, vector(0,0,0)) + self._pos
    def world_to_group(self, v):
        return _coerce_vector(v, vector(0,0,0)) - self._pos
    @property
    def pos(self): return self._pos
    @pos.setter
    def pos(self, v):
        _bind_vector(self, 'pos', _coerce_vector(v, vector(0,0,0)))
    @property
    def axis(self): return self._axis
    @axis.setter
    def axis(self, value):
        new_axis = _coerce_vector(value, vector(1,0,0))
        old_axis = self._axis
        if old_axis.mag > 0 and new_axis.mag > 0:
            ang = old_axis.diff_angle(new_axis)
            ax = old_axis.cross(new_axis)
            if ang > 1e-12 and ax.mag < 1e-12:
                # 정반대 방향(외적이 0): 옛 축에 수직인 축으로 반 바퀴 돈다
                ax = old_axis.cross(vector(0,1,0))
                if ax.mag < 1e-12:
                    ax = old_axis.cross(vector(1,0,0))
                ang = math.pi
            if ang > 1e-12:
                self._rotate_children(ang, ax, self._pos)
                self._up = self._up.rotate(ang, axis=ax)
        self._axis = new_axis
    @property
    def up(self): return self._up
    @up.setter
    def up(self, value):
        self._up = _coerce_vector(value, vector(0,1,0))
        for obj in self._objects:
            if isinstance(getattr(obj, '_up', None), vector):
                obj.up = self._up.clone()
    @property
    def color(self): return self._color
    @color.setter
    def color(self, value):
        self._color = _coerce_vector(value, vector(1,1,1))
        for obj in self._objects:
            if hasattr(obj, 'color'):
                obj.color = self._color.clone()
    @property
    def visible(self): return self._visible
    @visible.setter
    def visible(self, value):
        """묶음 전체를 숨기거나 보인다. 하위 객체 각각의 visible 값은 그대로 둔다."""
        self._visible = bool(value)
        _add_command({"action":"update","id":self._id,"visible":self._visible})
    def _rotate_children(self, angle, axis, origin):
        rel_origin = _coerce_vector(origin, self._pos) - self._pos
        for obj in self._objects:
            if hasattr(obj, 'rotate'):
                obj.rotate(angle, axis=axis, origin=rel_origin)
    def rotate(self, angle, axis=None, origin=None):
        if axis is None:
            if self._axis.mag > 0:
                axis = self._axis.clone()
            else:
                axis = vector(0,1,0)
        axis = _coerce_vector(axis, vector(0,1,0))
        if origin is None:
            origin = self._pos
        else:
            origin = _coerce_vector(origin, self._pos)
        self._rotate_children(angle, axis, origin)
        self._axis = self._axis.rotate(angle, axis=axis)
        self._up = self._up.rotate(angle, axis=axis)

def _coerce_vector(value, default=None):
    """vector, list, tuple을 vector로 맞춘다."""
    if isinstance(value, vector):
        # 사용자 벡터와 내부 상태 공유(aliasing) 방지 — 복제본 반환
        return value.clone()
    if isinstance(value, (list, tuple)) and len(value) >= 3:
        return vector(value[0], value[1], value[2])
    if isinstance(default, vector):
        return default.clone()
    return default


def _as_point(value):
    """vector 또는 (x, y, z)를 새 vector로"""
    if isinstance(value, vector):
        return value.clone()
    if isinstance(value, (list, tuple)) and len(value) == 3 and all(isinstance(c, (int, float)) for c in value):
        return vector(*value)
    raise TypeError(f"점은 vector 또는 (x, y, z) 형식이어야 합니다: {value!r}")


def _point_items(args):
    """curve/points의 생성자·append 인자를 점 항목 목록으로 편다.
    벡터 하나, (x, y, z), {'pos': v, 'color': c, 'radius': r}, 그리고 이들의 리스트와 여러 위치 인자를 모두 받는다."""
    items = []
    for a in args:
        if a is None:
            continue
        if isinstance(a, (vector, dict)):
            items.append(a)
        elif isinstance(a, (list, tuple)):
            if len(a) == 3 and all(isinstance(c, (int, float)) for c in a):
                items.append(vector(*a))
            else:
                items.extend(_point_items(a))
        else:
            raise TypeError(f"점은 vector, (x, y, z) 또는 {{'pos': ...}} 형식이어야 합니다: {a!r}")
    return items


class _PointList:
    """curve와 points의 공통 구현. 점마다 pos·color·radius를 저장하고 브릿지에 목록으로 보낸다."""
    _vector_attrs = ('color', 'origin', 'axis', 'up')
    _type = 'curve'

    def __init__(self, *args, **kwargs):
        self._id = _new_id()
        self._group = _group_ref(kwargs.pop('group', None))
        self._color = _coerce_vector(kwargs.get('color'), color.white)
        self._radius = float(kwargs.get('radius', 0))
        self._visible = bool(kwargs.get('visible', True))
        self._opacity = float(kwargs.get('opacity', 1.0))
        self._emissive = bool(kwargs.get('emissive', False))
        self._retain = int(kwargs.get('retain', -1))
        self._origin = _coerce_vector(kwargs.get('origin'), vector(0, 0, 0))
        self._axis = _coerce_vector(kwargs.get('axis'), vector(1, 0, 0))
        self._up = _coerce_vector(kwargs.get('up'), vector(0, 1, 0))
        self._pos_list = []
        self._color_list = []
        self._radius_list = []
        for item in _point_items(list(args) + [kwargs.get('pos')]):
            self._store(item)
        self._trim_retain()

        cmd = {
            "action": "create",
            "id": self._id,
            "type": self._type,
            "color": self._color.to_list(),
            "radius": self._radius,
            "visible": self._visible,
            "opacity": self._opacity,
            "emissive": self._emissive,
            "origin": self._origin.to_list(),
            "axis": self._axis.to_list(),
            "up": self._up.to_list(),
            "points": [p.to_list() for p in self._pos_list],
            "colors": [c.to_list() for c in self._color_list],
            "radii": list(self._radius_list),
        }
        cmd.update(self._extra_create(kwargs))
        if self._group is not None:
            self._group._objects.append(self)
            cmd['group'] = self._group._id
        _pick_targets[self._id] = self
        _add_command(cmd)

    def _extra_create(self, kwargs):
        return {}

    def _store(self, item, index=None):
        """점 항목 하나를 (pos, color, radius)로 나눠 저장한다."""
        if isinstance(item, dict):
            if 'pos' not in item:
                raise ValueError("점 dict에는 'pos'가 있어야 합니다. 예: {'pos': vector(0,0,0), 'color': color.red}")
            pos = _as_point(item['pos'])
            col = _coerce_vector(item.get('color'), self._color)
            rad = float(item.get('radius', self._radius))
        else:
            pos = _as_point(item)
            col = self._color.clone()
            rad = self._radius
        if index is None:
            self._pos_list.append(pos)
            self._color_list.append(col)
            self._radius_list.append(rad)
        else:
            self._pos_list[index] = pos
            self._color_list[index] = col
            self._radius_list[index] = rad

    def _send_all(self):
        """점 목록 전체를 다시 보낸다 (modify·pop·shift 등 뒤)."""
        _add_command({
            "action": "curve_set",
            "id": self._id,
            "points": [p.to_list() for p in self._pos_list],
            "colors": [c.to_list() for c in self._color_list],
            "radii": list(self._radius_list),
        })

    def _trim_retain(self):
        if self._retain > 0 and len(self._pos_list) > self._retain:
            cut = len(self._pos_list) - self._retain
            del self._pos_list[:cut]
            del self._color_list[:cut]
            del self._radius_list[:cut]
            return True
        return False

    # --- 점 추가·수정 ---
    def append(self, *args, **kwargs):
        """점 추가 — append(v), append(v1, v2), append([v1, v2]), append(pos=v, color=c, radius=r), append({'pos': v})"""
        if 'retain' in kwargs:
            self._retain = int(kwargs.pop('retain'))
        items = _point_items(args)
        if 'pos' in kwargs:
            pos_arg = kwargs['pos']
            if isinstance(pos_arg, (list, tuple)) and not (
                len(pos_arg) == 3 and all(isinstance(c, (int, float)) for c in pos_arg)
            ):
                # append(pos=[v1, v2, ...]) — 점 목록
                pos_items = _point_items([pos_arg])
            else:
                pos_items = [pos_arg]
            for p in pos_items:
                spec = dict(p) if isinstance(p, dict) else {'pos': p}
                for key in ('color', 'radius'):
                    if key in kwargs:
                        spec[key] = kwargs[key]
                items.append(spec)
        elif kwargs:
            # append(v, color=c) — 위치 인자 점에 색·반지름을 적용
            styled = []
            for it in items:
                spec = dict(it) if isinstance(it, dict) else {'pos': it}
                for key in ('color', 'radius'):
                    if key in kwargs:
                        spec[key] = kwargs[key]
                styled.append(spec)
            items = styled
        if not items:
            return
        start = len(self._pos_list)
        for it in items:
            self._store(it)
        if self._trim_retain():
            self._send_all()
            return
        _add_command({
            "action": "curve_append",
            "id": self._id,
            "points": [p.to_list() for p in self._pos_list[start:]],
            "colors": [c.to_list() for c in self._color_list[start:]],
            "radii": list(self._radius_list[start:]),
        })

    def push(self, *args, **kwargs):
        """append와 같다 (GlowScript 별칭)"""
        self.append(*args, **kwargs)

    def _build_items(self, items):
        """점 항목들을 (pos 목록, color 목록, radius 목록)으로 만든다 (기존 목록은 건드리지 않는다)."""
        saved = (self._pos_list, self._color_list, self._radius_list)
        self._pos_list, self._color_list, self._radius_list = [], [], []
        try:
            for it in items:
                self._store(it)
            built = (self._pos_list, self._color_list, self._radius_list)
        finally:
            self._pos_list, self._color_list, self._radius_list = saved
        return built

    def unshift(self, *args):
        """맨 앞에 점을 끼워 넣는다."""
        new_pos, new_col, new_rad = self._build_items(_point_items(args))
        self._pos_list[0:0] = new_pos
        self._color_list[0:0] = new_col
        self._radius_list[0:0] = new_rad
        self._trim_retain()
        self._send_all()

    def modify(self, index, *args, **kwargs):
        """index번째 점을 바꾼다 — modify(i, pos=v), modify(i, color=c), modify(i, x=1.5), modify(i, vector)"""
        n = len(self._pos_list)
        if not -n <= index < n:
            raise IndexError(f"점 번호 {index}이(가) 범위를 벗어났습니다 (점 {n}개)")
        spec = {}
        if args:
            first = args[0]
            if isinstance(first, dict):
                spec.update(first)
            else:
                spec['pos'] = first
        spec.update(kwargs)
        pos = _as_point(spec['pos']) if 'pos' in spec else self._pos_list[index].clone()
        for comp in ('x', 'y', 'z'):
            if comp in spec:
                setattr(pos, comp, float(spec[comp]))
        self._pos_list[index] = pos
        if 'color' in spec:
            self._color_list[index] = _coerce_vector(spec['color'], self._color)
        if 'radius' in spec:
            self._radius_list[index] = float(spec['radius'])
        self._send_all()

    def point(self, index):
        """index번째 점의 정보 dict — {'pos', 'color', 'radius', 'visible'}"""
        return {
            'pos': self._pos_list[index].clone(),
            'color': self._color_list[index].clone(),
            'radius': self._radius_list[index],
            'visible': self._visible,
        }

    def slice(self, start, end=None):
        """start부터 end 앞까지의 점 정보 dict 목록"""
        rng = range(len(self._pos_list))[start:end]
        return [self.point(i) for i in rng]

    def pop(self, index=-1):
        """점 하나를 빼서 dict로 돌려준다 (기본: 마지막 점)."""
        info = self.point(index)
        del self._pos_list[index]
        del self._color_list[index]
        del self._radius_list[index]
        self._send_all()
        return info

    def shift(self):
        """첫 점을 빼서 dict로 돌려준다."""
        return self.pop(0)

    def splice(self, start, howmany, *items):
        """start부터 howmany개를 지우고 그 자리에 items를 넣는다. 음수 start는 끝에서 센다 (JavaScript splice와 같음)."""
        n = len(self._pos_list)
        start = int(start)
        if start < 0:
            start = max(n + start, 0)
        start = min(start, n)
        end = min(start + max(int(howmany), 0), n)
        new_pos, new_col, new_rad = self._build_items(_point_items(items))
        self._pos_list[start:end] = new_pos
        self._color_list[start:end] = new_col
        self._radius_list[start:end] = new_rad
        self._trim_retain()
        self._send_all()

    def clear(self):
        """모든 점 지우기"""
        self._pos_list = []
        self._color_list = []
        self._radius_list = []
        _add_command({"action": "curve_clear", "id": self._id})

    def rotate(self, angle, axis=None, origin=None):
        """origin을 지나는 axis(기본: 자기 axis) 축으로 전체를 회전한다 (점 좌표는 그대로 두고 방향만 바꾼다)."""
        if axis is None:
            axis = self._axis.clone() if self._axis.mag > 0 else vector(0, 1, 0)
        axis = _coerce_vector(axis, vector(0, 1, 0))
        origin = _coerce_vector(origin, vector(0, 0, 0)) if origin is not None else self._origin
        rel = self._origin - origin
        self._origin = origin + rel.rotate(angle, axis=axis)
        self._axis = self._axis.rotate(angle, axis=axis)
        self._up = self._up.rotate(angle, axis=axis)
        _add_command({
            "action": "update", "id": self._id,
            "origin": self._origin.to_list(), "axis": self._axis.to_list(), "up": self._up.to_list(),
        })

    # --- 속성 ---
    @property
    def npoints(self):
        return len(self._pos_list)

    def __len__(self):
        return len(self._pos_list)

    @property
    def origin(self):
        return self._origin

    @origin.setter
    def origin(self, value):
        self._origin = _coerce_vector(value, vector(0, 0, 0))
        _add_command({"action": "update", "id": self._id, "origin": self._origin.to_list()})

    # GlowScript에서 curve.pos는 origin과 같은 뜻이다
    pos = origin

    @property
    def axis(self):
        return self._axis

    @axis.setter
    def axis(self, value):
        self._axis = _coerce_vector(value, vector(1, 0, 0))
        _add_command({"action": "update", "id": self._id, "axis": self._axis.to_list(), "up": self._up.to_list()})

    @property
    def up(self):
        return self._up

    @up.setter
    def up(self, value):
        self._up = _coerce_vector(value, vector(0, 1, 0))
        _add_command({"action": "update", "id": self._id, "axis": self._axis.to_list(), "up": self._up.to_list()})

    @property
    def color(self):
        return self._color

    @color.setter
    def color(self, value):
        """전체 색 — 점마다 준 색도 모두 이 색으로 바뀐다 (GlowScript와 같음)"""
        self._color = _coerce_vector(value, color.white)
        self._color_list = [self._color.clone() for _ in self._color_list]
        _add_command({"action": "update", "id": self._id, "color": self._color.to_list()})

    @property
    def radius(self):
        return self._radius

    @radius.setter
    def radius(self, value):
        self._radius = float(value)

class _ExportCamera:
    def __init__(self,owner): self._scene=owner
    @property
    def pos(self):
        return self._scene._read('pos',self._scene._center-self._scene._forward*self._scene._distance())
    @pos.setter
    def pos(self,v):
        axis=self.axis
        self._scene._center=v+axis
        self._scene._send('camera_pos',v.to_list())
    @property
    def axis(self): return self._scene.center-self.pos
    @axis.setter
    def axis(self,v):
        if v.mag==0: raise ValueError('camera.axis must be nonzero')
        self._scene._center=self.pos+v
        self._scene._forward=norm(v)
        self._scene._range=v.mag*math.tan(self._scene._fov/2)
        self._scene._send('camera_axis',v.to_list())
    def follow(self,obj=None): self._scene._send('camera_follow',getattr(obj,'_id',None))
    def rotate(self,angle=0,axis=None,origin=None):
        axis=axis if axis is not None else self._scene.forward
        old_pos,old_axis=self.pos,self.axis
        origin=origin if origin is not None else old_pos
        new_up=self._scene.up.rotate(angle,axis=axis)
        self.pos=origin+(old_pos-origin).rotate(angle,axis=axis)
        self.axis=old_axis.rotate(angle,axis=axis)
        self._scene.up=new_up

        self._fov=v

    @property

    @autoscale.setter

        self._send('autoscale',bool(v))
    @property

    @title.setter

    @caption.setter
    def caption(self,v):

        self._send('caption', self._caption)
    def bind(self, events, fn=None):
        if fn is None:
            return lambda handler: self.bind(events, handler)
        for name in events.split():
            if name in _key_handlers:
                if fn not in _key_handlers[name]:
                    _key_handlers[name].append(fn)
            else:
                _unsupported_warn("scene.bind(" + name + ")")
        return fn

    def unbind(self, events, fn=None):
        for name in events.split():
            handlers = _key_handlers.get(name, [])
            if fn is None:
                handlers.clear()
            elif fn in handlers:
                handlers.remove(fn)

    async def waitfor(self, events):
        """이벤트가 올 때까지 기다렸다가 이벤트 객체를 돌려준다(편집기·GlowScript scene.waitfor와 같음).
        scene.waitfor('click keydown')처럼 공백으로 여러 이벤트를 적으면 먼저 온 것 하나를 돌려준다.
        변환기가 호출 앞에 await를 붙이므로 학생 코드에서는 평범한 함수처럼 쓴다."""
        names = events.split() if isinstance(events, str) else list(events)
        if not names:
            raise ValueError("scene.waitfor에 이벤트 이름을 넣어 주세요 (예: 'click')")
        if all(name in ('redraw', 'draw_complete') for name in names):
            await rate(60)
            return _SimpleNamespace(event=names[0], pos=vector(0,0,0), pick=None, key=None, canvas=self)
        unknown = [name for name in names if name not in _key_handlers]
        for name in unknown:
            _unsupported_warn("scene.waitfor(" + name + ")")
        if len(unknown) == len(names):
            return None
        received = []
        def catch(event):
            received.append(event)
        for name in names:
            if name in _key_handlers:
                _key_handlers[name].append(catch)
        _send_commands()
        try:
            while not received:
                await asyncio.sleep(0.05)
        finally:
            for name in names:
                handlers = _key_handlers.get(name, [])
                if catch in handlers:
                    handlers.remove(catch)
        return received[0]

    async def pause(self, text=''):
        """화면을 클릭할 때까지 멈춘다(편집기·GlowScript scene.pause와 같음). 안내 문구를 줄 수 있다."""
        notice_id = _new_id()
        _add_command({"action": "pause_notice", "id": notice_id,
                      "text": str(text) if text else "▶ 화면을 클릭하면 계속합니다"})
        try:
            return await self.waitfor('click')
        finally:
            _add_command({"action": "widget_delete", "id": notice_id})
            _send_commands()
    @property
    def mouse(self):
        return _mouse_now

from types import SimpleNamespace as _SimpleNamespace
_key_handlers = {"keydown": [], "keyup": [], "click": [], "mousedown": [], "mouseup": [], "mousemove": []}
_pressed_keys = set()
_mouse_now = _SimpleNamespace(pos=vector(0,0,0), pick=None)

def _vpython_key(key):
    """브라우저 키 이름을 편집기와 같은 VPython 키 이름으로 바꾼다."""
    special = {
        'ArrowLeft': 'left', 'ArrowRight': 'right', 'ArrowUp': 'up', 'ArrowDown': 'down',
        'Enter': chr(10), 'Backspace': 'backspace', 'Delete': 'delete', 'Escape': 'esc',
        'Shift': 'shift', 'Control': 'ctrl', 'Alt': 'alt', 'Tab': 'tab',
        'CapsLock': 'caps lock', 'PageUp': 'pageup', 'PageDown': 'pagedown',
        'Home': 'home', 'End': 'end', 'Insert': 'insert', 'Pause': 'break',
    }
    if isinstance(key, str) and len(key) in (2, 3) and key[0] == 'F' and key[1:].isdigit():
        return key.lower()
    return special.get(key, key)

def _event_bound(name):
    return bool(_key_handlers.get(name))

def _mouse_state(payload):
    data = json.loads(str(payload))
    if data.get('pos'):
        _mouse_now.pos = vector(*data['pos'])
    _mouse_now.pick = _picked_object(data.get('pick'))

def _mouse_event(payload):
    data = json.loads(str(payload))
    name = data.get('name')
    pos = data.get('pos')
    event = _SimpleNamespace(event=name, pos=vector(*pos) if pos else vector(0,0,0),
                             pick=_picked_object(data.get('pick')), key=None, canvas=scene)
    if 'clientX' in data:
        event.clientX = data['clientX']
        event.clientY = data['clientY']
    for handler in list(_key_handlers.get(name, [])):
        _dispatch(handler, event)

def keysdown():
    return list(_pressed_keys)

def _dispatch(callback, event):
    async def invoke():
        try:
            result = callback(event)
            if asyncio.iscoroutine(result):
                await result
        except Exception as exc:
            print(str(exc))
        finally:
            _send_commands()
    asyncio.ensure_future(invoke())

def _key_event(name, key):
    if name == "blur":
        _pressed_keys.clear()
        return
    raw_key = key
    key = _vpython_key(raw_key)
    if name == "keydown":
        _pressed_keys.add(key)
    else:
        _pressed_keys.discard(key)
    for handler in list(_key_handlers.get(name, [])):
        _dispatch(handler, _SimpleNamespace(key=key, raw_key=raw_key, event=name, canvas=scene, pos=vector(0,0,0), pick=None))

_widget_instances = {}
_widget_values = {}
def _widget_event(widget_id, value):
    widget = _widget_instances.get(widget_id)
    if widget is None or widget.disabled:
        return
    _widget_values[widget_id] = value
    if callable(widget._bind):
        _dispatch(widget._bind, widget)

class _Widget:
    _kind = 'widget'

    def __init__(self, **kwargs):
        self._id = _new_id()
        _widget_instances[self._id] = self
        self._bind = kwargs.pop('bind', None)
        self._visible = kwargs.pop('visible', True)
        self._disabled = kwargs.pop('disabled', False)
        # bind 핸들러 등록 (id 기반)
        _widget_values[self._id] = kwargs.get('value', None)

    def _emit_create(self, extra):
        cmd = {
            "action": "widget_create",
            "id": self._id,
            "kind": self._kind,
            "visible": self._visible,
            "disabled": self._disabled,
        }
        cmd.update(extra)
        _add_command(cmd)

    @property
    def value(self):
        return _widget_values.get(self._id)

    @value.setter
    def value(self, v):
        _widget_values[self._id] = v
        _add_command({"action": "widget_update", "id": self._id, "value": v})

    @property
    def disabled(self):
        return self._disabled

    @disabled.setter
    def disabled(self, v):
        self._disabled = bool(v)
        _add_command({"action": "widget_update", "id": self._id, "disabled": self._disabled})

    def delete(self):
        _widget_instances.pop(self._id, None)
        _widget_values.pop(self._id, None)
        _add_command({"action": "widget_delete", "id": self._id})

# === rate/sleep ===
async def rate(fps, callback=None):
    _send_commands()
    if callback is not None:
        # GlowScript 콜백 형식 — 한 프레임 뒤 콜백을 별도 태스크로 부르고 바로 돌아온다
        async def _later():
            await asyncio.sleep(1.0/fps)
            result = callback()
            if asyncio.iscoroutine(result):
                await result
        asyncio.ensure_future(_later())
        await asyncio.sleep(0)
        return
    await asyncio.sleep(1.0/fps)

_KOREAN_NOTE_MAP = {
    '도':'C','레':'D','미':'E','파':'F','솔':'G','라':'A','시':'B',
    '도#':'C#','레#':'D#','파#':'F#','솔#':'G#','라#':'A#',
    '레b':'Db','미b':'Eb','솔b':'Gb','라b':'Ab','시b':'Bb',
}
def _resolve_note_name(name):
    if not name: return name
    for kr in sorted(_KOREAN_NOTE_MAP, key=len, reverse=True):
        en = _KOREAN_NOTE_MAP[kr]
        if name.startswith(kr):
            rest = name[len(kr):]
            if not rest or not rest[0].isdigit(): rest = '4' + rest
            return en + rest
    if len(name)==1 and name[0] in 'ABCDEFG': return name+'4'
    if len(name)==2 and name[0] in 'ABCDEFG' and name[1] in '#b': return name+'4'
    return name

def play_note(name, duration=0.5, type='sine', volume=0.4):
    resolved = _resolve_note_name(name)
    _add_command({"action":"sound","method":"note","name":resolved,"duration":duration,"type":type,"volume":volume})

def _note_frequency(name):
    """음 이름을 숫자 주파수로 바꾸어 실행 화면과 HTML 내보내기에서 함께 사용합니다."""
    match = re.fullmatch(r'([A-G])([#b]?)(-?[0-9]+)', _resolve_note_name(name))
    if not match:
        raise ValueError(f'음 이름을 확인해주세요: {name}')
    letter, accidental, octave = match.groups()
    pitch = {'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11}[letter]
    pitch += 1 if accidental == '#' else -1 if accidental == 'b' else 0
    return 440 * 2 ** (((int(octave) - 4) * 12 + pitch - 9) / 12)


def play_chord(frequencies, duration=1.0, type='sine', volume=0.25):
    """
    여러 주파수를 동시에 재생 (화음)
    frequencies: 주파수 또는 음 이름 리스트 [261.63, '미4', 'G4']
    """
    _add_command({
        "action": "sound",
        "method": "chord",
        "frequencies": [_note_frequency(value) if isinstance(value, str) else value for value in frequencies],
        "duration": duration,
        "type": type,
        "volume": volume,
    })


def play_sequence(notes):
    note_list = []
    for n in notes:

        if "volume" in n: item["volume"]=n["volume"]
        note_list.append(item)
    _add_command({"action":"sound","method":"sequence","notes":note_list})

class NamedList(list):
    def __init__(self, items, name_map=None):
        super().__init__(items)
        self._name_map = name_map or {}
    def __getitem__(self, key):
        if isinstance(key, str):
            if key in self._name_map: return super().__getitem__(self._name_map[key])
            raise KeyError(f"'{key}' 이름을 찾을 수 없습니다")
        return super().__getitem__(key)

def _resolve_instrument(name):
    if not name: return _INSTRUMENT_PRESETS['piano']
    resolved = _INSTRUMENT_KR.get(name, name).lower()
    return _INSTRUMENT_PRESETS.get(resolved, _INSTRUMENT_PRESETS['piano'])

def play_instrument(instrument, name, duration=0.5, volume=None):
    preset = _resolve_instrument(instrument)
    vol = volume if volume is not None else preset['volume']
    resolved = _resolve_note_name(name)
    _add_command({"action":"sound","method":"note","name":resolved,"duration":duration,"type":preset['type'],"volume":vol})

async def 악기(instrument, name, duration=0.5, volume=None):
